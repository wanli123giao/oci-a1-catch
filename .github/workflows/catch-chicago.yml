name: catch-chicago

on:
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: catch-chicago
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check account and restore missing cloud alarm
        env:
          HUNTER_ADMIN_TOKEN: ${{ secrets.HUNTER_ADMIN_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          base = "https://hunter.wanli.uk/api"
          headers = {"User-Agent": "Mozilla/5.0 a1-hunter-watchdog/3", "Content-Type": "application/json"}
          req = urllib.request.Request(base + "/status", headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              state = json.load(response).get("chicago") or {}
          if state.get("success", {}).get("iid"):
              print("Captured; creation remains stopped.")
          elif state.get("result") == "blocked":
              raise SystemExit("Account blocked: " + str(state.get("last_error", {}).get("message", "check dashboard")))
          elif not state.get("enabled"):
              print("Account paused; watchdog will not enable creation.")
          else:
              headers["Authorization"] = "Bearer " + os.environ["HUNTER_ADMIN_TOKEN"]
              data = json.dumps({"action": "wake", "region": "chicago"}).encode()
              req = urllib.request.Request(base + "/control", data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              print("Cloud scheduler healthy. Next attempt:", result.get("next_attempt_at"))
          PYEOF
